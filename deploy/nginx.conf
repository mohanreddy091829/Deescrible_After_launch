# Nginx site file. Replace YOURDOMAIN.com, then save as /etc/nginx/sites-available/deescribble
# and enable it:  ln -s /etc/nginx/sites-available/deescribble /etc/nginx/sites-enabled/
# Certbot adds the HTTPS (443) block for you the first time you run it.
server {
    listen 80;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;

    client_max_body_size 10m;          # admin image uploads (the app limits them to 8 MB)
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;                       # the app checks this to block cross-site posts
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;     # OVERWRITE (not append) so visitors can't fake their IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
